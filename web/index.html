<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <meta
    name="description"
    content="Deal - Buy and sell products easily."
  >

  <!-- iOS / PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Deal"
  >

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <link
    rel="apple-touch-icon"
    href="icons/Icon-192.png"
  >

  <link
    rel="icon"
    type="image/png"
    href="favicon.png"
  >

  <title>Deal</title>

  <link rel="manifest" href="manifest.json">

  <style>
    #installPrompt {
      position: fixed;

      left: 16px;
      right: 16px;
      bottom: 16px;

      z-index: 99999;

      display: none;

      max-width: 520px;
      margin: 0 auto;

      background: #12324A;
      color: #ffffff;

      border-radius: 16px;

      box-shadow:
        0 8px 28px rgba(0, 0, 0, 0.24);

      padding: 14px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    #installPrompt p {
      margin: 0;

      font-size: 14px;
      line-height: 1.6;
    }

    #installPrompt strong {
      display: block;

      margin-bottom: 4px;

      font-size: 15px;
    }

    #installPrompt .actions {
      display: flex;

      gap: 8px;

      margin-top: 12px;
    }

    #installPrompt button {
      border: 0;

      border-radius: 10px;

      padding: 9px 14px;

      cursor: pointer;

      font-size: 13px;
      font-weight: 700;
    }

    #installBtn {
      flex: 1;

      background: #2A9D8F;
      color: #ffffff;
    }

    #dismissBtn {
      background:
        rgba(255, 255, 255, 0.14);

      color: #ffffff;
    }
  </style>
</head>

<body>

  <div
    id="installPrompt"
    role="dialog"
    aria-live="polite"
    aria-label="تثبيت Deal"
    dir="rtl"
  >

    <p>
      <strong>ثبّت Deal على جهازك</strong>

      <span id="installText">
        ثبّت التطبيق للوصول إليه بسرعة من الشاشة الرئيسية.
      </span>
    </p>

    <div class="actions">

      <button
        id="installBtn"
        type="button"
      >
        تثبيت Deal
      </button>

      <button
        id="dismissBtn"
        type="button"
      >
        لاحقًا
      </button>

    </div>

  </div>


  <script>
    let deferredInstallPrompt = null;

    const installPrompt =
        document.getElementById('installPrompt');

    const installBtn =
        document.getElementById('installBtn');

    const dismissBtn =
        document.getElementById('dismissBtn');

    const installText =
        document.getElementById('installText');


    function showInstallPrompt() {
      installPrompt.style.display = 'block';
    }


    function hideInstallPrompt() {
      installPrompt.style.display = 'none';
    }


    // Android / Chrome / compatible browsers
    window.addEventListener(
      'beforeinstallprompt',
      (event) => {

        event.preventDefault();

        deferredInstallPrompt = event;

        showInstallPrompt();
      }
    );


    installBtn.addEventListener(
      'click',
      async () => {

        if (!deferredInstallPrompt) {
          return;
        }

        deferredInstallPrompt.prompt();

        await deferredInstallPrompt.userChoice;

        deferredInstallPrompt = null;

        hideInstallPrompt();
      }
    );


    dismissBtn.addEventListener(
      'click',
      hideInstallPrompt
    );


    window.addEventListener(
      'appinstalled',
      hideInstallPrompt
    );


    // iPhone / iPad
const isIos =
    /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
    (
      navigator.platform === 'MacIntel' &&
      navigator.maxTouchPoints > 1
    );

const isStandalone =
    window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;

if (isIos && !isStandalone) {
  installText.textContent =
      'على iPhone/iPad: اضغط زر المشاركة في Safari ثم اختر "إضافة إلى الشاشة الرئيسية".';

  installBtn.style.display = 'none';

  showInstallPrompt();
}
  </script>


  <script
    src="flutter_bootstrap.js"
    async
  ></script>

</body>
</html>
